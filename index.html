<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura Flow Collection</title>
<!-- Подключение шрифта Pacifico -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
<!-- Иконки FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ... (все предыдущие стили остаются без изменений) ... */

/* Стиль для кнопки "В разработке" */
.in-dev-btn {
padding: 12px 24px;
background-color: #666; /* серый фон вместо черного */
color: #fff;
border: none;
border-radius: 10px;
font-family: 'Roboto', cursive;
font-size: 14px;
font-weight: 600;
cursor: not-allowed; /* курсор "недоступно" */
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
transition: all 0.3s ease;
opacity: 0.7;
}

.in-dev-btn:hover {
background-color: #666;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
transform: none; /* убираем анимацию при наведении */
}

/* Стиль для товара в разработке */
.product.in-dev {
position: relative;
}

.product.in-dev::after {
content: "В РАЗРАБОТКЕ";
position: absolute;
top: 10px;
right: 10px;
background-color: rgba(0, 0, 0, 0.8);
color: white;
padding: 5px 10px;
border-radius: 5px;
font-size: 10px;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 1px;
}

/* Медиазапросы остаются без изменений */
</style>
<link rel="icon" href="ДОРАБОТКА.png" sizes="512x512" type="image/png">
</head>
<body>

<!-- ... (весь предыдущий HTML код до товаров остается без изменений) ... -->

<!-- Контейнер товаров -->
<div class="products" id="products-container">
<!-- Товары будут добавлены программно -->
</div>

<!-- ... (весь остальной HTML код остается без изменений) ... -->

<script>
// Массив товаров с изображениями - ОБНОВЛЕННЫЙ
const products = [
{ 
name: 'Футболка "Luxury That Breathes" Black', 
price: 2990, 
image: 'product1.jpg',
hoverImage: 'product1-hover.jpg',
preorder: false,
link: 't-shirt1.html',
sizes: ['S', 'M', 'L', 'XL'],
color: 'Черно-красный'
},
{ 
name: 'Футболка "Luxury That Breathes" White', 
price: 2990, 
image: 'product2.jpg',
hoverImage: 'product2-hover.jpg',
preorder: true,
link: 't-shirt1.html',
sizes: ['S', 'M', 'L', 'XL'],
color: 'Бело-черный'
},
{ 
name: 'Футболка "Luxury That Breathes" Grey', 
price: 2990, 
image: 'product3.jpg',
hoverImage: 'product3-hover.jpg',
preorder: true,
link: 't-shirt1.html',
sizes: ['S', 'M', 'L', 'XL'],
color: 'Серо-черный'
},
{ 
name: 'Шапка "Urban Flow"', 
price: 1200, 
image: 'product4.jpg',
hoverImage: 'product4-hover.jpg',
preorder: false,
link: '#',
sizes: ['Универсальный'],
color: 'Черный'
},
// НОВЫЕ ТОВАРЫ "В РАЗРАБОТКЕ"
{ 
name: 'Поло "Premium Cotton"', 
price: 3490, 
image: 'in-dev.jpg', // Можно использовать одну картинку для всех "в разработке"
hoverImage: 'in-dev.jpg',
preorder: false,
link: '#',
sizes: ['S', 'M', 'L', 'XL'],
color: 'Белый, Черный, Синий',
inDev: true // Флаг "в разработке"
},
{ 
name: 'Шорты "Summer Flow"', 
price: 2590, 
image: 'in-dev.jpg',
hoverImage: 'in-dev.jpg',
preorder: false,
link: '#',
sizes: ['S', 'M', 'L', 'XL'],
color: 'Черный, Бежевый, Оливковый',
inDev: true
},
{ 
name: 'Кепка "Street Style"', 
price: 990, 
image: 'in-dev.jpg',
hoverImage: 'in-dev.jpg',
preorder: false,
link: '#',
sizes: ['Универсальный'],
color: 'Черный, Хаки, Нави',
inDev: true
},
{ 
name: 'Рюкзак "Urban Travel"', 
price: 4290, 
image: 'in-dev.jpg',
hoverImage: 'in-dev.jpg',
preorder: false,
link: '#',
sizes: ['Универсальный'],
color: 'Черный, Серый, Камуфляж',
inDev: true
}
];

// функция отображения товаров - ОБНОВЛЕННАЯ
function renderProducts() {
const container = document.getElementById('products-container');
container.innerHTML = '';
products.forEach((prod, index) => {
const div = document.createElement('div');
div.className = 'product' + (prod.inDev ? ' in-dev' : '');
div.innerHTML = `
     <a href="${prod.link}" class="product-link" ${prod.inDev ? 'style="pointer-events: none; cursor: default;"' : ''}>
       <div class="product-image">
         <img src="${prod.image}" alt="${prod.name}" class="main-image">
         <img src="${prod.hoverImage}" alt="${prod.name}" class="hover-image">
       </div>
       <h3>${prod.name}</h3>
       <p>Цена: ${prod.price} ₽</p>
     </a>
     <button 
       data-index="${index}" 
       ${prod.inDev ? 'class="in-dev-btn" disabled' : ''}
     >
       ${prod.inDev ? 'В разработке' : (prod.preorder ? 'Оформить предзаказ' : 'Добавить в корзину')}
     </button>
   `;
container.appendChild(div);
});
}

// ... (весь остальной JavaScript код остается без изменений) ...

// Инициализация страницы
document.addEventListener('DOMContentLoaded', () => {
renderProducts();
setupAddButtons();
setupCartControls();
setupMenu();
setupCartModal();
setupBackToTop();
setupDocuments();
updateCartCount();
});
</script>
</body>
</html>
